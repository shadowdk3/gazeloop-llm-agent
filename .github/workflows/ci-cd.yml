name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - ci-cd
  pull_request:
    branches:
      - master
      - ci-cd
  workflow_dispatch:  # <--- This enables manual/forced triggering from the web UI

jobs:
  # 1. Run Tests First (CI)
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  # 2. Build Docker Image (CD) - Only runs if 'test' succeeds
  docker-build:
    needs: test  # <--- This ensures CI runs first!
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Git commit:"
          git log -1 --oneline

          echo "Python:"
          python --version

          echo "NumPy requirement:"
          grep "numpy" requirements.txt

          echo "Dockerfile:"
          head -5 Dockerfile

          echo "Docker:"
          docker version

      - name: Build Docker image
        run: |
          docker build -t gazeloop-llm-agent:${{ github.sha }} .